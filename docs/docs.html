<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3e9">
  <title>Sano · MVP Docs</title>
  <script>
    // Apply the chosen brand before CSS paints (see brand.js).
    (function () {
      var b = new URLSearchParams(location.search).get('brand');
      try { b = b || localStorage.getItem('brand'); } catch (e) {}
      if (b === 'youmay') document.documentElement.dataset.brand = b;
    })();
  </script>
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Wider than the app screens so diagrams have room; each diagram scrolls on its own on phones. */
    .top-row, main.doc { max-width: 960px; }
    main.doc { display: block; padding-bottom: 48px; line-height: 1.55; }
    .doc h1 { margin: 12px 0 8px; }
    .doc h2 { margin: 28px 0 10px; font-size: 19px; }
    .doc .diagram { background: var(--card); border-radius: 18px; padding: 16px; overflow-x: auto; margin: 12px 0; }
    .doc .diagram svg { display: block; margin: 0 auto; max-width: 100% !important; }
    @media (max-width: 700px) { .doc .diagram svg { max-width: none !important; } }
    .doc table { border-collapse: collapse; width: 100%; background: var(--card); border-radius: 12px; overflow: hidden; font-size: 14px; }
    .doc th, .doc td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
    .doc code { background: var(--card-2); border-radius: 6px; padding: 1px 5px; font-size: 13px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand"><span data-mark data-size="26"></span><span class="wordmark" data-wordmark>Sano</span></div>
      <a class="pill-link" href="index.html">‹ App</a>
    </div>
  </header>

  <main id="doc" class="doc"><p class="muted">Loading…</p></main>

  <script src="brand.js"></script>
  <!-- Renders mvp.md so the diagrams live in one file. -->
  <script type="module">
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js';
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';

    const el = document.getElementById('doc');
    const md = await fetch('mvp.md', { cache: 'no-store' }).then((r) => r.text());
    el.innerHTML = marked.parse(md);
    el.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
      const div = document.createElement('div');
      div.className = 'diagram mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false });
    await mermaid.run({ querySelector: '.mermaid' });
    // Natural size, not shrunk to fit (styles.css makes every svg 100% wide): on phones each diagram scrolls in its card.
    el.querySelectorAll('.mermaid svg').forEach((svg) => {
      svg.style.width = svg.viewBox.baseVal.width + 'px';
    });
  </script>
</body>
</html>
