<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sano</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <div class="brand"><span data-mark data-size="26"></span><span class="wordmark">Sano</span></div>
        <div class="date" id="today"></div>
      </div>
      <div class="row" style="gap:8px">
        <a class="pill-link" href="onboarding.html">Onboarding ›</a>
        <div class="avatar" aria-hidden="true">R</div>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar" aria-label="Main">
    <a class="on" href="#"><span>◉</span>Today</a>
    <a href="#"><span>🍲</span>Recipes</a>
    <button class="fab" data-coach aria-label="Open AI coach"><i data-mark="mono" data-size="30"></i>Coach</button>
    <a href="#"><span>🛒</span>Pantry</a>
    <a href="#"><span>📈</span>Progress</a>
  </nav>

  <div id="coach" class="coach-layer" role="dialog" aria-label="AI coach" hidden></div>

  <div id="tip" class="tip" role="status" hidden></div>

  <script src="brand.js"></script>
  <script src="app.js"></script>
  <script src="coach.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
