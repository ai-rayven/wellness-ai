<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f855a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Wellness AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <div class="date" id="today"></div>
        <h1>Dashboard</h1>
      </div>
      <div class="avatar" aria-hidden="true">R</div>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar" aria-label="Main">
    <a class="on" href="#"><span>◉</span>Today</a>
    <a href="#"><span>🍲</span>Recipes</a>
    <button class="fab" data-coach aria-label="Open AI coach"><i>✦</i>Coach</button>
    <a href="#"><span>🛒</span>Pantry</a>
    <a href="#"><span>📈</span>Progress</a>
  </nav>

  <div id="coach" class="coach-layer" role="dialog" aria-label="AI coach" hidden></div>

  <div id="tip" class="tip" role="status" hidden></div>

  <script src="app.js"></script>
  <script src="coach.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
